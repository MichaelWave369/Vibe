name: VibeWeb experimental build
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  verify-vibeweb:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Vibe and pytest
        run: python -m pip install -e . pytest
      - name: Run VibeWeb tests
        run: python -m pytest -q tests/test_web.py tests/test_web_ci.py
      - name: Compile first VibeWeb page
        run: python -m vibe.web vibe/examples/web_counter.vibe --out dist
      - name: Compile reusable component laboratory
        run: python -m vibe.web vibe/examples/web_components.vibe --out dist-components
      - name: Compile isolated instance laboratory
        run: python -m vibe.web vibe/examples/web_instances.vibe --out dist-instances
      - name: Exercise generated JavaScript runtime
        run: node tests/web_runtime_smoke.cjs dist-instances/index.html
      - name: Compile reactive forms and grid laboratory
        run: python -m vibe.web vibe/examples/web_forms_grid.vibe --out dist-forms
      - name: Exercise generated form input runtime
        run: node tests/web_forms_runtime_smoke.cjs dist-forms/index.html
      - name: Upload static artifact
        uses: actions/upload-artifact@v4
        with:
          name: vibeweb-first-light
          path: dist/
