name: Deploy VibeWeb to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Check out pinned Vibe compiler
        uses: actions/checkout@v4
        with:
          repository: MichaelWave369/Vibe
          ref: 5ed4ef6108b86e3b91c0cb24c55b25576af0cffd
          path: .vibe-toolchain
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Vibe toolchain
        run: python -m pip install --no-deps ./.vibe-toolchain
      - name: Rebuild and verify VibeWeb source
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          sources=(source/*.vibe)
          if [[ "${#sources[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one source/*.vibe file"
            exit 1
          fi
          # Never publish a stale precompiled index if source compilation fails.
          rm -f site/index.html site/vibeweb.report.json
          python -m vibe.web "${sources[0]}" --out site
          test -s site/index.html
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("site/vibeweb.report.json").read_text(encoding="utf-8"))
          if report.get("result") != "emitted" or report.get("bridge_passed") is not True:
              raise SystemExit("VibeWeb native verification failed; refusing deployment")
          print("VibeWeb compiled and heuristic preservation gate passed")
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload compiled site only
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
